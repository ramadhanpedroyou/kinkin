<!DOCTYPE html> 
<html lang="id"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Surat Spesial</title> 
    <style> 
        * { box-sizing: border-box; margin: 0; padding: 0; } 
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e0f2fe; /* Biru muda yang menenangkan */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            text-align: center; 
            overflow: hidden; 
        } 
        .container { padding: 20px; max-width: 400px; width: 100%; } 
        h1 { color: #0284c7; margin-bottom: 20px; font-size: 2rem; } 
        
        /* Halaman Pertama: Surat */ 
        .envelope-wrapper { cursor: pointer; transition: transform 0.3s ease; display: inline-block; } 
        .envelope-wrapper:hover { transform: scale(1.05); } 
        .envelope-icon { font-size: 100px; animation: bounce 2s infinite; } 
        .hint { margin-top: 15px; color: #38bdf8; font-weight: bold; font-size: 1.1rem; } 
        
        /* Halaman Kedua: Isi Surat (Tersembunyi di awal) */ 
        .hidden { display: none !important; } 
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #38bdf8; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; } 
        .love-text { font-size: 2.5rem; color: #0284c7; font-weight: bold; animation: pulseBlue 1.5s infinite; display: block; text-align: center; width: 100%; } 
        .tagline { font-size: 1.2rem; color: #0369a1; margin-top: 15px; display: block; text-align: center; width: 100%; } 
        
        /* Animasi */ 
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-7px); } } 
        @keyframes pulseBlue { 0% { transform: scale(1); } 14% { transform: scale(1.05); } 28% { transform: scale(1); } 42% { transform: scale(1.05); } 70% { transform: scale(1); } } 
    </style> 
</head> 
<body> 
    <div class="container"> 
        <!-- HALAMAN 1: TOMBOL SURAT --> 
        <div id="page1"> 
            <h1>Untuk KinKin 💙</h1> 
            <div class="envelope-wrapper" onclick="bukaSurat()"> 
                <div class="envelope-icon">✉️</div> 
            </div> 
            <p class="hint">klik disini</p> 
        </div> 
        
        <!-- HALAMAN 2: ISI SURAT --> 
        <div id="page2" class="hidden"> 
            <img src="Kinah.jpg.jpeg" alt="Foto Pacar" class="profile-img"> 
            <div class="love-text">I Love You 💙</div> 
            <p class="tagline">Untuk Kinah, love you!</p> 
        </div> 
    </div> 
    
    <script> 
        function bukaSurat() { 
            document.getElementById('page1').classList.add('hidden'); 
            document.getElementById('page2').classList.remove('hidden'); 
        } 
    </script> 
</body> 
</html>
